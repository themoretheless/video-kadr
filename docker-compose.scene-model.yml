services:
  backend:
    environment:
      ISOLATION_TIER: lan
      SCENE_DESCRIPTION_OLLAMA_URL: http://127.0.0.1:11434
      SCENE_DESCRIPTION_INSTALLER: "${SCENE_DESCRIPTION_INSTALLER:?Set the Video Kadr installer username}"

  scene-model:
    image: ollama/ollama:0.40.16
    # Share the backend's loopback interface without exposing the model API.
    network_mode: "service:backend"
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - scene-model-data:/root/.ollama
    depends_on:
      backend:
        condition: service_started
        restart: true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
    init: true
    restart: unless-stopped

volumes:
  scene-model-data:
