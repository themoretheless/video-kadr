services:
  backend:
    build: ./backend
    environment:
      STORAGE_DIR: /data
      # Internal docker network only; the public surface is the frontend nginx proxy.
      BIND_ADDR: 0.0.0.0
    volumes:
      - storage:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  storage:
