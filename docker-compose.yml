services:
  backend:
    build: ./backend
    environment:
      STORAGE_DIR: /data
      # Internal docker network only; the public surface is the frontend nginx proxy.
      BIND_ADDR: 0.0.0.0
    volumes:
      - storage:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8088:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  storage:
