services:
  backend:
    build: ./backend
    environment:
      STORAGE_DIR: /data
      BIND_ADDR: 0.0.0.0
    volumes:
      - storage:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8088:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  storage:
