[package]
name = "video-editor-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "set-header", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
# Embedded SQLite (statically bundled) for persistent projects / jobs.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
# Hashing the (source + edit) into a render-cache key.
sha2 = "0.10"

[dev-dependencies]
# `util` brings `tower::ServiceExt::oneshot`, used to drive the router in tests
# without binding a socket. `tempfile` gives each test an isolated storage dir.
tower = { version = "0.4", features = ["util"] }
tempfile = "3"
