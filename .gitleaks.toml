title = "Video Kadr secret detection policy"

[extend]
useDefault = true

[[rules]]
id = "video-kadr-query-token"
description = "Credential-like token embedded in a URL query string"
regex = '''(?i)https?://[^\s"']+[?&](?:access_token|api_key|apikey|auth|secret|token)=[A-Za-z0-9_~.+/=-]{8,}'''
keywords = ["access_token", "api_key", "apikey", "auth", "secret", "token"]

[[rules]]
id = "video-kadr-bearer-token"
description = "Bearer credential outside fixtures"
regex = '''(?i)bearer\s+[A-Za-z0-9._~+/=-]{16,}'''
keywords = ["bearer"]

[allowlist]
description = "Reviewed non-secret examples"
paths = [
  '''docs/threat-model-upload\.md''',
  '''\.gitleaks\.toml''',
]
